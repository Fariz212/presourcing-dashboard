name: KHS application checks

on:
  push:
    branches: [khs]
  pull_request:
    branches: [khs]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: "ci-only-secret-not-used-in-production"
      DATABASE_URL: postgresql://khs_app:khs_ci_password@localhost:5432/khs_monitoring
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: khs_monitoring
          POSTGRES_USER: khs_app
          POSTGRES_PASSWORD: khs_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U khs_app -d khs_monitoring"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Apply database schema to disposable CI database
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f migrations/001_initial_schema.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f migrations/002_import_change_classification.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f migrations/003_khs_injection_and_evidence.sql
      - name: Compile application and tests
        run: python -m compileall -q app tests
      - name: Run test suite
        run: python -m pytest -q
