<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Presourcing Control</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap');

:root{
  --ink:#12181F;
  --panel:#1B232C;
  --panel-2:#212B35;
  --border:#2E3944;
  --border-soft:#252F39;
  --text:#E7E4DD;
  --text-muted:#8B93A0;
  --text-dim:#5E6A78;
  --amber:#C98A3B;
  --amber-soft:rgba(201,138,59,.14);
  --green:#4C9A6A;
  --green-soft:rgba(76,154,106,.14);
  --red:#C1503D;
  --red-soft:rgba(193,80,61,.14);
  --slate:#5C7A94;
  --slate-soft:rgba(92,122,148,.14);
}
*{box-sizing:border-box;}
body{
  margin:0; background:var(--ink); color:var(--text);
  font-family:'Space Grotesk',sans-serif; font-size:14px;
  -webkit-font-smoothing:antialiased;
}
.mono{font-family:'JetBrains Mono',monospace; font-variant-numeric:tabular-nums;}
.app{max-width:1180px; margin:0 auto; padding:28px 24px 60px;}

/* header */
.hdr{display:flex; align-items:flex-end; justify-content:space-between; border-bottom:1px solid var(--border); padding-bottom:16px; margin-bottom:20px; flex-wrap:wrap; gap:14px;}
.hdr h1{font-size:20px; font-weight:600; margin:0 0 4px; letter-spacing:.01em;}
.hdr .sub{color:var(--text-muted); font-size:12.5px;}
.tabs{display:flex; gap:4px;}
.tab{padding:8px 14px; border:1px solid var(--border); background:var(--panel); color:var(--text-muted); cursor:pointer; font-size:13px; font-family:inherit;}
.tab.active{background:var(--amber-soft); border-color:var(--amber); color:var(--amber);}
.tab:hover:not(.active){color:var(--text);}
.btn-primary{padding:9px 16px; background:var(--amber); border:none; color:#12181F; font-weight:600; cursor:pointer; font-family:inherit; font-size:13px;}
.btn-primary:hover{filter:brightness(1.08);}
.btn-ghost{padding:8px 14px; background:transparent; border:1px solid var(--border); color:var(--text-muted); cursor:pointer; font-family:inherit; font-size:12.5px;}
.btn-ghost:hover{border-color:var(--text-muted); color:var(--text);}

/* kpi row */
.kpirow{display:grid; grid-template-columns:repeat(4,1fr); gap:1px; background:var(--border); border:1px solid var(--border); margin-bottom:22px;}
.kpi{background:var(--panel); padding:16px 18px;}
.kpi .label{color:var(--text-muted); font-size:11.5px; margin-bottom:8px;}
.kpi .val{font-family:'JetBrains Mono',monospace; font-size:26px; font-weight:600; font-variant-numeric:tabular-nums;}
.kpi .unit{font-size:13px; color:var(--text-muted); margin-left:3px;}

/* panel */
.panel{border:1px solid var(--border); background:var(--panel); margin-bottom:22px;}
.panel-hd{display:flex; justify-content:space-between; align-items:center; padding:12px 16px; border-bottom:1px solid var(--border); flex-wrap:wrap; gap:10px;}
.panel-hd h2{font-size:13.5px; margin:0; font-weight:600; color:var(--text);}
.panel-body{padding:14px 16px;}

/* filters */
.filters{display:flex; gap:8px; flex-wrap:wrap;}
select, input, textarea{
  background:var(--panel-2); border:1px solid var(--border); color:var(--text);
  padding:7px 9px; font-family:inherit; font-size:12.5px;
}
select:focus, input:focus, textarea:focus{outline:1px solid var(--amber);}

/* table */
table{width:100%; border-collapse:collapse;}
th{text-align:left; font-size:11px; color:var(--text-dim); font-weight:500; padding:8px 10px; border-bottom:1px solid var(--border); text-transform:none;}
td{padding:9px 10px; border-bottom:1px solid var(--border-soft); font-size:13px; vertical-align:top;}
tr.proj-row{cursor:pointer;}
tr.proj-row:hover{background:var(--panel-2);}
.num{font-family:'JetBrains Mono',monospace; text-align:right; font-variant-numeric:tabular-nums;}

.tag{display:inline-block; padding:2px 8px; font-size:11px; border:1px solid; line-height:1.6;}
.tag-medium{color:var(--slate); border-color:var(--slate); background:var(--slate-soft);}
.tag-high{color:var(--amber); border-color:var(--amber); background:var(--amber-soft);}
.tag-urgent{color:var(--red); border-color:var(--red); background:var(--red-soft);}
.tag-win{color:var(--green); border-color:var(--green); background:var(--green-soft);}
.tag-lose{color:var(--red); border-color:var(--red); background:var(--red-soft);}
.tag-ongoing{color:var(--amber); border-color:var(--amber); background:var(--amber-soft);}

.detail-block{background:var(--ink); border:1px solid var(--border); margin:6px 0 12px; padding:12px 14px;}
.sow-title{font-size:12.5px; color:var(--amber); margin:10px 0 4px; font-weight:600;}
.boq-title{font-size:12px; color:var(--text-muted); margin:6px 0 2px;}
.item-row{display:grid; grid-template-columns:1.6fr .9fr .9fr .8fr 1.2fr; gap:8px; padding:5px 0; font-size:12.5px; border-bottom:1px solid var(--border-soft); align-items:center;}
.item-row.hd{color:var(--text-dim); font-size:10.5px; border-bottom:1px solid var(--border);}
.pic-chip{display:inline-block; background:var(--panel-2); border:1px solid var(--border); padding:1px 7px; font-size:11px; margin:1px 3px 1px 0; color:var(--text-muted);}

/* leaderboard bars */
.lb-row{display:grid; grid-template-columns:110px 1fr 70px; gap:10px; align-items:center; padding:7px 0; border-bottom:1px solid var(--border-soft);}
.lb-name{font-size:12.5px;}
.lb-bar-track{background:var(--panel-2); height:8px; position:relative; border:1px solid var(--border);}
.lb-bar-fill{position:absolute; left:0; top:0; bottom:0; background:var(--amber);}
.lb-val{font-family:'JetBrains Mono',monospace; text-align:right; font-size:12px; color:var(--text-muted);}

/* modal / form */
.overlay{position:fixed; inset:0; background:rgba(0,0,0,.6); display:flex; align-items:flex-start; justify-content:center; padding:40px 20px; overflow:auto; z-index:50;}
.modal{background:var(--panel); border:1px solid var(--border); width:100%; max-width:760px; max-height:90vh; overflow:auto;}
.modal-hd{display:flex; justify-content:space-between; align-items:center; padding:14px 18px; border-bottom:1px solid var(--border); position:sticky; top:0; background:var(--panel);}
.modal-hd h3{margin:0; font-size:14.5px;}
.modal-body{padding:18px;}
.field{margin-bottom:12px;}
.field label{display:block; font-size:11.5px; color:var(--text-muted); margin-bottom:4px;}
.field input, .field select, .field textarea{width:100%;}
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
.grid3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px;}
.sow-block{border:1px solid var(--border); padding:12px; margin-bottom:12px; background:var(--ink);}
.boq-block{border:1px solid var(--border-soft); padding:10px; margin:8px 0; background:var(--panel-2);}
.item-block{border-top:1px solid var(--border-soft); padding-top:8px; margin-top:8px;}
.mini-btn{background:transparent; border:1px solid var(--border); color:var(--text-muted); font-size:11px; padding:4px 8px; cursor:pointer; font-family:inherit;}
.mini-btn:hover{color:var(--text); border-color:var(--text-muted);}
.mini-btn.danger{color:var(--red); border-color:var(--red);}
.pic-select{display:flex; gap:6px; flex-wrap:wrap;}
.pic-opt{padding:3px 9px; border:1px solid var(--border); font-size:11.5px; cursor:pointer; color:var(--text-muted);}
.pic-opt.on{background:var(--amber-soft); border-color:var(--amber); color:var(--amber);}
.modal-ft{display:flex; justify-content:flex-end; gap:8px; padding:14px 18px; border-top:1px solid var(--border); position:sticky; bottom:0; background:var(--panel);}
.empty{color:var(--text-dim); font-size:12.5px; padding:20px 0; text-align:center;}
.note{font-size:11px; color:var(--text-dim); margin-top:4px;}
</style>
</head>
<body>
<div class="app" id="app"></div>
<!-- Memanggil JavaScript dari folder static Flask -->
<script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
