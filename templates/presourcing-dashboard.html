<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Presourcing Control</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap');

:root{
  --ink:#F8FAFC;          /* Background utama putih/abu sangat lembut */
  --panel:#FFFFFF;        /* Kartu/Panel putih bersih */
  --panel-2:#F1F5F9;      /* Background hover / input abu-abu sangat muda */
  --border:#CBD5E1;       /* Border halus standar */
  --border-soft:#E2E8F0;  /* Border pemisah tipis */
  --text:#1E293B;         /* Teks utama abu-abu gelap (sangat tajam & nyaman dibaca) */
  --text-muted:#64748B;   /* Teks sekunder abu-abu sedang */
  --text-dim:#94A3B8;     /* Teks redup */
  
  /* Aksen Biru Korporat Profesional */
  --primary:#2563EB;
  --primary-hover:#1D4ED8;
  --primary-soft:rgba(37,99,235,.08);
  
  /* Status Warna yang Harmonis dengan Tema Terang */
  --amber:#D97706;
  --amber-soft:rgba(217,119,6,.1);
  --green:#059669;
  --green-soft:rgba(5,150,105,.1);
  --red:#DC2626;
  --red-soft:rgba(220,38,38,.1);
  --slate:#475569;
  --slate-soft:rgba(71,85,105,.1);
}
*{box-sizing:border-box;}
body{
  margin:0; background:var(--ink); color:var(--text);
  font-family:'Space Grotesk',sans-serif; font-size:14px;
  -webkit-font-smoothing:antialiased;
}
.mono{font-family:'JetBrains Mono',monospace; font-variant-numeric:tabular-nums;}
.app{max-width:1180px; margin:0 auto; padding:28px 24px 60px;}

/* header */
.hdr{display:flex; align-items:flex-end; justify-content:space-between; border-bottom:1px solid var(--border); padding-bottom:16px; margin-bottom:20px; flex-wrap:wrap; gap:14px;}
.hdr h1{font-size:22px; font-weight:700; margin:0 0 4px; letter-spacing:-.01em; color:#0F172A;}
.hdr .sub{color:var(--text-muted); font-size:12.5px;}
.tabs{display:flex; gap:6px;}
.tab{padding:8px 16px; border:1px solid var(--border); background:var(--panel); color:var(--text-muted); cursor:pointer; font-size:13px; font-weight:500; font-family:inherit; border-radius:6px; transition:all .15s ease;}
.tab.active{background:var(--primary-soft); border-color:var(--primary); color:var(--primary); font-weight:600;}
.tab:hover:not(.active){color:var(--text); background:var(--panel-2);}

.btn-primary{padding:9px 18px; background:var(--primary); border:none; color:#FFFFFF; font-weight:600; cursor:pointer; font-family:inherit; font-size:13px; border-radius:6px; transition:background .15s ease;}
.btn-primary:hover{background:var(--primary-hover);}

.btn-ghost{padding:8px 14px; background:transparent; border:1px solid var(--border); color:var(--text-muted); cursor:pointer; font-family:inherit; font-size:12.5px; border-radius:6px;}
.btn-ghost:hover{border-color:var(--text-muted); color:var(--text); background:var(--panel-2);}

/* kpi row */
.kpirow{display:grid; grid-template-columns:repeat(4,1fr); gap:16px; margin-bottom:22px;}
.kpi{background:var(--panel); padding:18px 20px; border:1px solid var(--border); border-radius:8px; box-shadow:0 1px 3px rgba(0,0,0,.02);}
.kpi .label{color:var(--text-muted); font-size:12px; font-weight:500; margin-bottom:6px;}
.kpi .val{font-family:'JetBrains Mono',monospace; font-size:26px; font-weight:700; color:#0F172A; font-variant-numeric:tabular-nums;}
.kpi .unit{font-size:13px; color:var(--text-muted); margin-left:3px; font-weight:normal;}

/* panel */
.panel{border:1px solid var(--border); background:var(--panel); margin-bottom:22px; border-radius:8px; box-shadow:0 1px 3px rgba(0,0,0,.02); overflow:hidden;}
.panel-hd{display:flex; justify-content:space-between; align-items:center; padding:14px 18px; border-bottom:1px solid var(--border-soft); background:#FAFAFA; flex-wrap:wrap; gap:10px;}
.panel-hd h2{font-size:14px; margin:0; font-weight:600; color:#0F172A;}
.panel-body{padding:16px 18px;}

/* filters */
.filters{display:flex; gap:8px; flex-wrap:wrap;}
select, input, textarea{
  background:#FFFFFF; border:1px solid var(--border); color:var(--text);
  padding:7px 10px; font-family:inherit; font-size:12.5px; border-radius:6px;
}
select:focus, input:focus, textarea:focus{outline:2px solid var(--primary-soft); border-color:var(--primary);}

/* table */
table{width:100%; border-collapse:collapse;}
th{text-align:left; font-size:11.5px; color:var(--text-muted); font-weight:600; padding:10px 12px; border-bottom:1px solid var(--border); background:#FAFAFA; text-transform:uppercase; letter-spacing:.03em;}
td{padding:11px 12px; border-bottom:1px solid var(--border-soft); font-size:13px; vertical-align:middle;}
tr.proj-row{cursor:pointer; transition:background .1s ease;}
tr.proj-row:hover{background:var(--panel-2);}
.num{font-family:'JetBrains Mono',monospace; text-align:right; font-variant-numeric:tabular-nums;}

.tag{display:inline-block; padding:3px 9px; font-size:11px; font-weight:500; border-radius:4px; line-height:1.4;}
.tag-medium{color:var(--slate); border:1px solid var(--border); background:var(--slate-soft);}
.tag-high{color:var(--amber); border:1px solid var(--border); background:var(--amber-soft);}
.tag-urgent{color:var(--red); border:1px solid var(--border); background:var(--red-soft);}
.tag-win{color:var(--green); border:1px solid var(--border); background:var(--green-soft);}
.tag-lose{color:var(--red); border:1px solid var(--border); background:var(--red-soft);}
.tag-ongoing{color:var(--primary); border:1px solid var(--border); background:var(--primary-soft);}

.detail-block{background:#FAFAFA; border:1px solid var(--border); border-radius:6px; margin:8px 0 14px; padding:14px 16px;}
.sow-title{font-size:13px; color:var(--primary); margin:12px 0 6px; font-weight:700;}
.boq-title{font-size:12px; color:var(--text-muted); margin:8px 0 4px; font-weight:600;}
.item-row{display:grid; grid-template-columns:1.6fr .9fr .9fr .8fr 1.2fr; gap:8px; padding:6px 0; font-size:12.5px; border-bottom:1px solid var(--border-soft); align-items:center;}
.item-row.hd{color:var(--text-dim); font-size:10.5px; border-bottom:1px solid var(--border);}
.pic-chip{display:inline-block; background:#FFFFFF; border:1px solid var(--border); padding:2px 8px; font-size:11px; border-radius:4px; margin:1px 3px 1px 0; color:var(--text); font-weight:500;}

/* leaderboard bars */
.lb-row{display:grid; grid-template-columns:120px 1fr 70px; gap:12px; align-items:center; padding:8px 0; border-bottom:1px solid var(--border-soft);}
.lb-name{font-size:13px; font-weight:500;}
.lb-bar-track{background:var(--border-soft); height:8px; position:relative; border-radius:4px; overflow:hidden;}
.lb-bar-fill{position:absolute; left:0; top:0; bottom:0; background:var(--primary); border-radius:4px;}
.lb-val{font-family:'JetBrains Mono',monospace; text-align:right; font-size:12px; color:var(--text-muted); font-weight:600;}

/* modal / form */
.overlay{position:fixed; inset:0; background:rgba(15,23,42,.4); backdrop-filter:blur(2px); display:flex; align-items:flex-start; justify-content:center; padding:40px 20px; overflow:auto; z-index:50;}
.modal{background:var(--panel); border:1px solid var(--border); width:100%; max-width:760px; max-height:90vh; overflow:auto; border-radius:10px; box-shadow:0 20px 25px -5px rgba(0,0,0,.1), 0 10px 10px -5px rgba(0,0,0,.04);}
.modal-hd{display:flex; justify-content:space-between; align-items:center; padding:16px 20px; border-bottom:1px solid var(--border-soft); position:sticky; top:0; background:var(--panel); z-index:2;}
.modal-hd h3{margin:0; font-size:15px; font-weight:700; color:#0F172A;}
.modal-body{padding:20px;}
.field{margin-bottom:14px;}
.field label{display:block; font-size:12px; font-weight:600; color:var(--text-muted); margin-bottom:5px;}
.field input, .field select, .field textarea{width:100%;}
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
.grid3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:14px;}
.sow-block{border:1px solid var(--border); padding:14px; margin-bottom:14px; background:#FAFAFA; border-radius:6px;}
.boq-block{border:1px solid var(--border-soft); padding:12px; margin:10px 0; background:#FFFFFF; border-radius:6px;}
.item-block{border-top:1px solid var(--border-soft); padding-top:10px; margin-top:10px;}
.mini-btn{background:#FFFFFF; border:1px solid var(--border); color:var(--text-muted); font-size:11.5px; padding:5px 10px; cursor:pointer; font-family:inherit; border-radius:5px; transition:all .1s ease;}
.mini-btn:hover{color:var(--text); border-color:var(--text-muted); background:var(--panel-2);}
.mini-btn.danger{color:var(--red); border-color:var(--red); background:var(--red-soft);}
.pic-select{display:flex; gap:6px; flex-wrap:wrap;}
.pic-opt{padding:4px 10px; border:1px solid var(--border); font-size:11.5px; cursor:pointer; color:var(--text-muted); background:#FFFFFF; border-radius:4px; font-weight:500;}
.pic-opt.on{background:var(--primary-soft); border-color:var(--primary); color:var(--primary); font-weight:600;}
.modal-ft{display:flex; justify-content:flex-end; gap:8px; padding:16px 20px; border-top:1px solid var(--border-soft); position:sticky; bottom:0; background:var(--panel); z-index:2;}
.empty{color:var(--text-dim); font-size:13px; padding:24px 0; text-align:center;}
.note{font-size:11.5px; color:var(--text-muted); margin-top:6px; line-height:1.4;}
</style>
</head>
<body>
<div class="app" id="app">
  <!-- INBOX SECTION (BARU) -->
<div class="card" style="margin-bottom: 24px; border-left: 4px solid var(--primary);">
  <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
    <div>
      <h3 style="margin: 0;">📬 Inbox Request (Dari Presales)</h3>
      <p style="margin: 4px 0 0; font-size: 13px; color: var(--text-muted);">Tiket baru yang belum di-assign ke tim Presourcing.</p>
    </div>
    <button class="btn btn-outline" onclick="fetchInbox()">🔄 Refresh Inbox</button>
  </div>
  
  <div class="table-wrapper">
    <table id="inbox-table">
      <thead>
        <tr>
          <th>Ticket ID</th>
          <th>Requester</th>
          <th>Kebutuhan / Project</th>
          <th>SLA Date</th>
          <th>Status</th>
          <th>Aksi</th>
        </tr>
      </thead>
      <tbody id="inbox-body">
        <tr><td colspan="6" style="text-align: center;">Memuat data...</td></tr>
      </tbody>
    </table>
  </div>
</div>
</div>

<!-- 1. Memanggil JavaScript eksternal (Ditutup langsung) -->
<script src="{{ url_for('static', filename='script.js') }}"></script>

<!-- 2. Tag script BARU khusus untuk fitur Inbox -->
<script>
  // --- FITUR INBOX REQUEST (BARU) ---

  // Fungsi ini menarik semua data dari database (karena admin)
  async function fetchInbox() {
      try {
          const res = await fetch('/api/requests?role=admin'); 
          const result = await res.json();
          
          if (result.success) {
              renderInbox(result.data);
          }
      } catch (error) {
          console.error("Gagal menarik data inbox:", error);
      }
  }

  function renderInbox(data) {
      const tbody = document.getElementById('inbox-body');
      tbody.innerHTML = ''; 

      // Filter hanya tiket yang masih 'unassigned'
      const newRequests = data.filter(req => req.status === 'unassigned');

      if (newRequests.length === 0) {
          tbody.innerHTML = `<tr><td colspan="6" style="text-align: center; color: #64748B;">🎉 Tidak ada request baru. Inbox bersih!</td></tr>`;
          return;
      }

      newRequests.forEach(req => {
          const tr = document.createElement('tr');
          tr.innerHTML = `
              <td><b>${req.ticket_id}</b></td>
              <td><span style="background: #E2E8F0; padding: 2px 8px; border-radius: 4px; font-size: 12px;">@${req.requester_username}</span></td>
              <td>${req.title}</td>
              <td style="color: #EF4444; font-weight: 600;">${req.sla_date}</td>
              <td><span style="background: #FEF08A; color: #854D0E; padding: 4px 8px; border-radius: 12px; font-size: 11px; font-weight: bold;">New Request</span></td>
              <td>
                  <button class="btn btn-primary" style="padding: 6px 12px; font-size: 12px;" onclick="alert('Catatan SA: ${req.notes}')">Review & Assign</button>
              </td>
          `;
          tbody.appendChild(tr);
      });
  }

  // Panggil fungsi ini otomatis saat dashboard dibuka
  document.addEventListener('DOMContentLoaded', () => {
      fetchInbox();
  });
</script>

</body>
</html>
