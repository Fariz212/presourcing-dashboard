<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Ganti Password | Presourcing</title>
  <style>
    :root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#211b46;background:#f7f5fc;font-synthesis:none}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 12% 8%,#e6ddff 0,transparent 42%),radial-gradient(ellipse at 90% 92%,#f7e6d8 0,transparent 38%),#f7f5fc}
    .card{width:min(100%,480px);background:#fff;border:1px solid #e8e1f5;border-radius:24px;box-shadow:0 24px 70px #29145e13;padding:clamp(24px,5vw,40px)}
    .mark{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:#7657ec;color:#fff;font-weight:900;font-size:18px;box-shadow:0 8px 24px #7657ec33}
    .eyebrow{margin-top:24px;font-size:11px;font-weight:800;letter-spacing:.16em;color:#7657ec;text-transform:uppercase}h1{font-size:27px;letter-spacing:-.04em;margin:8px 0 10px}p{line-height:1.6;color:#6f6888;font-size:14px;margin:0 0 24px}
    .field{margin:16px 0}.field label{display:block;font-size:12px;font-weight:750;margin-bottom:7px}.field input{width:100%;height:46px;border:1px solid #dcd5eb;border-radius:12px;padding:0 13px;font:inherit;color:#211b46;outline:none;background:#fff}.field input:focus{border-color:#7657ec;box-shadow:0 0 0 4px #7657ec18}.hint{font-size:11px;color:#88819d;margin-top:6px}
    .button{width:100%;height:48px;border:0;border-radius:13px;background:#7657ec;color:white;font-size:14px;font-weight:800;cursor:pointer;margin-top:12px}.button:hover{background:#6546dd}.button:disabled{opacity:.55;cursor:wait}.message{display:none;border-radius:12px;padding:11px 13px;font-size:12px;line-height:1.5;margin:16px 0 0}.message.error{display:block;background:#fff0f2;color:#9e2640;border:1px solid #ffd8df}.message.success{display:block;background:#edf9f1;color:#17683c;border:1px solid #ccebd6}.footer{margin-top:20px;text-align:center;font-size:11px;color:#9690a9}
  </style>
</head>
<body>
  <main class="card">
    <div class="mark" aria-hidden="true">P</div>
    <div class="eyebrow">Account security</div>
    <h1>Buat password baru</h1>
    <p>Akun ini menggunakan password sementara. Ganti sekarang sebelum melanjutkan ke workspace agar akun kamu tetap aman.</p>
    <form id="password-form">
      <div class="field"><label for="current-password">Password sementara / saat ini</label><input id="current-password" name="current_password" type="password" autocomplete="current-password" required></div>
      <div class="field"><label for="new-password">Password baru</label><input id="new-password" name="new_password" type="password" autocomplete="new-password" minlength="12" required><div class="hint">Minimal 12 karakter. Hindari password yang digunakan di layanan lain.</div></div>
      <div class="field"><label for="confirm-password">Ulangi password baru</label><input id="confirm-password" name="confirm_password" type="password" autocomplete="new-password" minlength="12" required></div>
      <button class="button" id="submit-button" type="submit">Simpan password baru</button>
    </form>
    <div id="message" class="message" role="status" aria-live="polite"></div>
    <div class="footer">Presourcing · Leasing workspace</div>
  </main>
  <script>
    const form=document.getElementById('password-form');
    const button=document.getElementById('submit-button');
    const message=document.getElementById('message');
    form.addEventListener('submit',async event=>{
      event.preventDefault();
      const current_password=document.getElementById('current-password').value;
      const new_password=document.getElementById('new-password').value;
      const confirm_password=document.getElementById('confirm-password').value;
      message.className='message';message.textContent='';
      if(new_password.length<12){message.className='message error';message.textContent='Password baru minimal 12 karakter.';return;}
      if(new_password!==confirm_password){message.className='message error';message.textContent='Konfirmasi password tidak sama.';return;}
      if(new_password===current_password){message.className='message error';message.textContent='Password baru harus berbeda dari password saat ini.';return;}
      button.disabled=true;button.textContent='Menyimpan…';
      try{
        const response=await fetch('/api/change-password',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({current_password,new_password,confirm_password})});
        const data=await response.json().catch(()=>({}));
        if(!response.ok||!data.success)throw new Error(data.message||`Gagal menyimpan password (${response.status}).`);
        message.className='message success';message.textContent='Password berhasil diperbarui. Mengalihkan ke workspace…';
        setTimeout(()=>{window.location.assign(data.redirect_url||'/leasing');},400);
      }catch(error){message.className='message error';message.textContent=error.message||'Terjadi kesalahan. Coba lagi.';}
      finally{button.disabled=false;button.textContent='Simpan password baru';}
    });
  </script>
</body>
</html>
